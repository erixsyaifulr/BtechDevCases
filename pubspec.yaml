name: btech_wallet_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # common package
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  intl: ^0.20.2
  shimmer: ^3.0.0

  # state management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # network
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0

  # local storage
  flutter_secure_storage: ^10.0.0

  # generator
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^9.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  envied: ^1.3.2

  # routing
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  auto_route_generator: ^10.4.0
  envied_generator: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
